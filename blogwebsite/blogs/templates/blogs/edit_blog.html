{% extends "blogs/basic.html" %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow-lg p-4 rounded-4">
        <h2 class="text-center mb-4 text-primary fw-bold">✍️ Edit Your Blog</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-semibold">Title</label>
                <input type="text" name="title" value="{{ blog.title }}" class="form-control rounded-3" required>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Head 0</label>
                <input type="text" name="head0" value="{{ blog.head0 }}" class="form-control rounded-3">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Head 1</label>
                <input type="text" name="head1" value="{{ blog.head1 }}" class="form-control rounded-3">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Head 2</label>
                <input type="text" name="head2" value="{{ blog.head2 }}" class="form-control rounded-3">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Content Head 0</label>
                <textarea name="chead0" rows="3" class="form-control rounded-3">{{ blog.chead0 }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Content Head 1</label>
                <textarea name="chead1" rows="3" class="form-control rounded-3">{{ blog.chead1 }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Content Head 2</label>
                <textarea name="chead2" rows="3" class="form-control rounded-3">{{ blog.chead2 }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Thumbnail Image</label>
                <input type="file" name="image_thumbnail" class="form-control rounded-3">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Image 1</label>
                <input type="file" name="image1" class="form-control rounded-3">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Image 2</label>
                <input type="file" name="image2" class="form-control rounded-3">
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-success btn-lg px-4 rounded-3 shadow-sm">
                    💾 Update Blog
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
