{% extends 'blogs/basic.html' %}
{% load static %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <!-- Card Design -->
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-gradient text-white rounded-top-4" 
                     style="background: linear-gradient(135deg, #28a745, #218838);">
                    <h3 class="mb-0 text-center text-dark">✏️ Edit Your Profile</h3>
                </div>

                <div class="card-body p-4">
                    <form method="POST" enctype="multipart/form-data" class="needs-validation" novalidate>
                        {% csrf_token %}

                        <!-- Django Form -->
                        <div class="form-group mb-3">
                            {{ form.as_p }}
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'profile' user.id %}" class="btn btn-outline-secondary rounded-pill px-4">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-success rounded-pill px-4 shadow-sm">
                                💾 Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
